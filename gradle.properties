org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# 16 KB page-size compatibility (required for Android 15+ apps shipping to Google Play).
# AGP 8.5+ preserves .so alignment automatically; the flags below are belt-and-braces.
android.bundle.enableUncompressedNativeLibs=true
android.useFullClasspathForDexingTransform=true

kotlin.code.style=official

# Replace with your Maps SDK key in local.properties (do not commit)
# MAPS_API_KEY=AIzaSyA8kdjZBM0lVcjS9byaHbEYgEm3R21LQBI
